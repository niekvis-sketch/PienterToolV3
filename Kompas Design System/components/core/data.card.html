  .lbl { font-size: 11px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 10px; }
  .row { display:flex; gap: 8px; align-items:center; flex-wrap:wrap; margin-bottom: 18px; }

<body>
<div class="kompas-app" id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Badge, Avatar, Tabs, Card, CardHeader, CardBody, Button, Icon } = window.VeldDesignSystem_c2e968;
  function Demo() {
    return (
      <div>
        <p className="lbl">Badges</p>
        <div className="row">
          <Badge variant="primary" dot>Actief</Badge>
          <Badge variant="accent">Hot lead</Badge>
          <Badge variant="highlight">Team website</Badge>
          <Badge variant="success" dot>Gewonnen</Badge>
          <Badge variant="warning" dot>Wacht op klant</Badge>
          <Badge variant="danger" dot>Verloren</Badge>
          <Badge variant="neutral">+ 3</Badge>
          <Badge variant="outline">SaaS</Badge>
        </div>
        <p className="lbl">Avatars</p>
        <div className="row">
          <Avatar name="Sanne Krijger" />
          <Avatar name="Iris Klamer" tone="accent" />
          <Avatar name="Niek Visser" tone="pink" size={40} />
          <Avatar name="Daan Versteeg" tone="neutral" size={40} />
        </div>
        <Tabs items={[{value:'a',label:'Overzicht'},{value:'b',label:'Activiteit'},{value:'c',label:'Inbox',badge:3},{value:'d',label:'Notities'}]} defaultValue="a" />

            <Button variant="ghost" size="sm">Alles tonen<Icon name="arrowR" size={13} /></Button>

          <CardBody style={{ fontSize: 13.5, color: 'var(--ink-2)' }}>

          </CardBody>
        </Card>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
