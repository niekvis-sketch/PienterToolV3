<!-- @dsCard group="Type" viewport="700x180" name="Mono / data & weights" subtitle="JetBrains Mono for numbers · Poppins weights 400–700" -->
<!doctype html>
<html lang="nl"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;}
  body{background:var(--bg);font-family:var(--font-sans);color:var(--ink);padding:20px 24px;}
  .lbl{font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px;}
  .block{margin-bottom:20px;}
  .mono{font-family:var(--font-mono);}
  .wt{display:flex;gap:26px;align-items:baseline;}
  .wt span{font-size:26px;}
  .wt small{display:block;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);font-weight:400;letter-spacing:0;margin-top:2px;}
</style></head>
<body>
  <div class="block">
    <p class="lbl">Mono · data &amp; numbers</p>
    <div class="mono" style="font-size:18px;color:var(--ink);">€ 12.480,00 &nbsp;·&nbsp; NL &nbsp;·&nbsp; #B-203 &nbsp;·&nbsp; ⌘K</div>
  </div>
  <div class="block">
    <p class="lbl">Weights</p>
    <div class="wt">
      <div><span style="font-weight:400;">Aa</span><small>400 Regular</small></div>
      <div><span style="font-weight:500;">Aa</span><small>500 Medium</small></div>
      <div><span style="font-weight:600;">Aa</span><small>600 Semibold</small></div>
      <div><span style="font-weight:700;">Aa</span><small>700 Bold</small></div>
    </div>
  </div>
</body></html>
