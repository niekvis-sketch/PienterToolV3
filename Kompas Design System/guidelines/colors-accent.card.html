<!-- @dsCard group="Colors" viewport="700x150" name="Accent · Rose" subtitle="Decorative soft rose — blobs, photo frames; -deep for readable text" -->
<!doctype html>
<html lang="nl"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;}
  body{background:var(--bg);font-family:var(--font-sans);padding:20px 22px;}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;}
  .sw{height:74px;border-radius:var(--r-2);border:1px solid var(--line);position:relative;overflow:hidden;}
  .hex{position:absolute;top:8px;left:10px;font-family:var(--font-mono);font-size:10.5px;}
  .meta{margin-top:8px;}
  .nm{font-size:12px;font-weight:500;color:var(--ink);}
  .vn{font-family:var(--font-mono);font-size:10px;color:var(--ink-3);}
</style></head>
<body>
  <div class="grid">
    <div><div class="sw" style="background:var(--accent)"><span class="hex" style="color:var(--on-accent)">#F6BDCA</span></div><div class="meta"><div class="nm">Accent</div><div class="vn">--accent</div></div></div>
    <div><div class="sw" style="background:var(--accent-hover)"><span class="hex" style="color:var(--on-accent)">#F0A6B7</span></div><div class="meta"><div class="nm">Hover</div><div class="vn">--accent-hover</div></div></div>
    <div><div class="sw" style="background:var(--accent-press)"><span class="hex" style="color:var(--on-accent)">#E58FA4</span></div><div class="meta"><div class="nm">Press</div><div class="vn">--accent-press</div></div></div>
    <div><div class="sw" style="background:var(--accent-soft)"><span class="hex" style="color:var(--accent-deep)">#FCE9EE</span></div><div class="meta"><div class="nm">Soft</div><div class="vn">--accent-soft</div></div></div>
    <div><div class="sw" style="background:var(--accent-soft-2)"><span class="hex" style="color:var(--accent-deep)">#F9D2DB</span></div><div class="meta"><div class="nm">Soft 2</div><div class="vn">--accent-soft-2</div></div></div>
    <div><div class="sw" style="background:var(--accent-deep)"><span class="hex" style="color:#fff">#B85674</span></div><div class="meta"><div class="nm">Deep</div><div class="vn">--accent-deep</div></div></div>
  </div>
</body></html>
