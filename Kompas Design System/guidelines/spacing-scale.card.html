<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing scale" subtitle="4px base — 4 · 8 · 12 · 16 · 24 · 32 · 48 · 64" -->
<!doctype html>
<html lang="nl"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;}
  body{background:var(--bg);font-family:var(--font-sans);color:var(--ink);padding:20px 24px;}
  .r{display:flex;align-items:center;gap:14px;margin-bottom:9px;}
  .t{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);width:64px;}
  .bar{height:10px;background:var(--accent);border-radius:var(--r-1);}
</style></head>
<body>
  <div class="r"><span class="t">--s-1 · 4</span><div class="bar" style="width:4px;"></div></div>
  <div class="r"><span class="t">--s-2 · 8</span><div class="bar" style="width:8px;"></div></div>
  <div class="r"><span class="t">--s-3 · 12</span><div class="bar" style="width:12px;"></div></div>
  <div class="r"><span class="t">--s-4 · 16</span><div class="bar" style="width:16px;"></div></div>
  <div class="r"><span class="t">--s-6 · 24</span><div class="bar" style="width:24px;"></div></div>
  <div class="r"><span class="t">--s-8 · 32</span><div class="bar" style="width:32px;"></div></div>
  <div class="r"><span class="t">--s-12 · 48</span><div class="bar" style="width:48px;"></div></div>
  <div class="r"><span class="t">--s-16 · 64</span><div class="bar" style="width:64px;"></div></div>
</body></html>
