<!-- @dsCard group="Colors" viewport="820x150" name="Primary · Sage" subtitle="Brand green #48B070 · deeper action green for buttons & text" -->
<!doctype html>
<html lang="nl"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;}
  body{background:var(--bg);font-family:var(--font-sans);padding:20px 22px;}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;}
  .sw{height:74px;border-radius:var(--r-2);border:1px solid var(--line);position:relative;overflow:hidden;}
  .hex{position:absolute;top:8px;left:10px;font-family:var(--font-mono);font-size:11px;}
  .meta{margin-top:8px;}
  .nm{font-size:12.5px;font-weight:500;color:var(--ink);}
  .vn{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);}
</style></head>
<body>
  <div class="grid">
    <div><div class="sw" style="background:var(--primary)"><span class="hex" style="color:rgba(255,255,255,.9)">#48B070</span></div><div class="meta"><div class="nm">Primary</div><div class="vn">--primary</div></div></div>
    <div><div class="sw" style="background:var(--primary-strong)"><span class="hex" style="color:rgba(255,255,255,.92)">#2C7D49</span></div><div class="meta"><div class="nm">Strong</div><div class="vn">--primary-strong</div></div></div>
    <div><div class="sw" style="background:var(--primary-hover)"><span class="hex" style="color:rgba(255,255,255,.9)">#3E9760</span></div><div class="meta"><div class="nm">Hover</div><div class="vn">--primary-hover</div></div></div>
    <div><div class="sw" style="background:var(--primary-press)"><span class="hex" style="color:rgba(255,255,255,.9)">#347F51</span></div><div class="meta"><div class="nm">Press</div><div class="vn">--primary-press</div></div></div>
    <div><div class="sw" style="background:var(--primary-soft)"><span class="hex" style="color:var(--primary-press)">#E9F5EE</span></div><div class="meta"><div class="nm">Soft</div><div class="vn">--primary-soft</div></div></div>
    <div><div class="sw" style="background:var(--primary-soft-2)"><span class="hex" style="color:var(--primary-press)">#CCE9D7</span></div><div class="meta"><div class="nm">Soft 2</div><div class="vn">--primary-soft-2</div></div></div>
  </div>
</body></html>
