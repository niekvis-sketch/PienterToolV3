<!-- @dsCard group="Colors" viewport="700x160" name="Neutrals · Warm cream" subtitle="Backgrounds, surfaces, lines and ink — the calm warm base" -->
<!doctype html>
<html lang="nl"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;}
  body{background:var(--bg);font-family:var(--font-sans);padding:20px 22px;}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
  .sw{height:74px;border-radius:var(--r-2);border:1px solid var(--line);position:relative;overflow:hidden;}
  .hex{position:absolute;top:8px;left:10px;font-family:var(--font-mono);font-size:11px;}
  .meta{margin-top:8px;}
  .nm{font-size:12.5px;font-weight:500;color:var(--ink);}
  .vn{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);}
</style></head>
<body>
  <div class="grid">
    <div><div class="sw" style="background:var(--bg)"><span class="hex" style="color:var(--ink-2)">#F9F7F2</span></div><div class="meta"><div class="nm">Background</div><div class="vn">--bg</div></div></div>
    <div><div class="sw" style="background:var(--bg-elev)"><span class="hex" style="color:var(--ink-2)">#F3F0E8</span></div><div class="meta"><div class="nm">Elevated</div><div class="vn">--bg-elev</div></div></div>
    <div><div class="sw" style="background:var(--surface)"><span class="hex" style="color:var(--ink-2)">#FFFFFF</span></div><div class="meta"><div class="nm">Surface</div><div class="vn">--surface</div></div></div>
    <div><div class="sw" style="background:var(--line-strong)"><span class="hex" style="color:var(--ink-2)">#D9D2C0</span></div><div class="meta"><div class="nm">Line strong</div><div class="vn">--line-strong</div></div></div>
    <div><div class="sw" style="background:var(--ink)"><span class="hex" style="color:rgba(249,247,242,.9)">#1F2A22</span></div><div class="meta"><div class="nm">Ink</div><div class="vn">--ink</div></div></div>
  </div>
</body></html>
