<!-- @startingPoint section="Screens" subtitle="Pienter CRM dashboard shell — sidebar + workspace" viewport="1180x720" -->
<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Pienter CRM — Kompas</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; height: 100%; }
  #root { position: fixed; inset: 0; }
  .crm-shell { display: flex; height: 100%; }
  .crm-work { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .crm-scroll { flex: 1; overflow-y: auto; }
</style>
</head>
<body>
<div class="kompas-app" id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="TopBar.jsx"></script>
<script type="text/babel" src="DashboardScreen.jsx"></script>
<script type="text/babel" src="TableScreen.jsx"></script>
<script type="text/babel" src="ArchiveScreen.jsx"></script>
<script type="text/babel">
  const LABELS = { overview:'Overzicht', clients:'Klanten', deals:'Deals', pipeline:'Pijplijn', inbox:'Inbox', agenda:'Agenda', reports:'Rapportages', settings:'Instellingen' };
  function screenFor(id) {
    if (id === 'deals' || id === 'pipeline') return 'table';
    if (id === 'clients') return 'archive';
    return 'dashboard';
  }
  function App() {
    const [nav, setNav] = React.useState('overview');
    const screen = screenFor(nav);
    return (
      <div className="crm-shell">
        <Sidebar active={nav} onNavigate={setNav} />
        <div className="crm-work">
          <TopBar crumb={LABELS[nav]} />
          <div className="crm-scroll">
            {screen === 'dashboard' && <DashboardScreen />}
            {screen === 'table' && <TableScreen />}
            {screen === 'archive' && <ArchiveScreen />}
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
